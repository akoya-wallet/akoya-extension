name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # weekly full re-scan, catches newly published advisories
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Job-level reusable-workflow calls are resolved by GitHub before any step runs, so the
    # filesystem-state risk behind `self-repository` does not apply; actionlint 1.7.12 rejects `$/`.
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # checkout + read-only API calls
