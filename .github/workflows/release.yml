name: release

# Push a tag vX.Y.Z (use `npm run release -- X.Y.Z`) to publish a GitHub release.
# Nothing is published unless the full security gate passes first; the published zip must be
# byte-identical to the one the gate built (and to the macOS rebuild), and it ships with a signed
# SLSA build-provenance attestation and a signed CycloneDX SBOM.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Job-level reusable-workflow calls are resolved by GitHub before any step runs, so the
    # filesystem-state risk behind `self-repository` does not apply; actionlint 1.7.12 rejects `$/`.
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # checkout + read-only API calls

  publish:
    name: publish
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write     # create the GitHub release and upload its assets
      id-token: write     # OIDC token for keyless Sigstore signing of the attestations
      attestations: write # store the provenance + SBOM attestations on GitHub
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          package-manager-cache: false # never restore caches into a release build

      - name: Tag must match manifest and package versions
        run: |
          m="$(node -p "require('./public/manifest.json').version")"
          p="$(node -p "require('./package.json').version")"
          if [ "v$m" != "$GITHUB_REF_NAME" ] || [ "$m" != "$p" ]; then
            echo "tag $GITHUB_REF_NAME, manifest $m, package $p" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: node scripts/audit-dist.mjs
      - run: bash scripts/package.sh

      - name: Release zip must equal the zip built by the security gate
        env:
          GATE_SHA256: ${{ needs.security.outputs.zip-sha256 }}
        run: |
          got="$(cut -d' ' -f1 release/*.zip.sha256)"
          echo "gate=$GATE_SHA256 release=$got"
          test -n "$GATE_SHA256" && test "$got" = "$GATE_SHA256"

      - name: SBOM (CycloneDX, production dependencies)
        run: npm sbom --sbom-format=cyclonedx --omit=dev > "release/akoya-${GITHUB_REF_NAME#v}.cdx.json"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/akoya-*.zip

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/akoya-*.zip
          sbom-path: release/akoya-*.cdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x releases are alpha: published as pre-releases
          pre=""; case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/akoya-*.zip release/akoya-*.zip.sha256 release/akoya-*.cdx.json \
            --repo "$GITHUB_REPOSITORY" --title "Akoya $GITHUB_REF_NAME" --generate-notes --verify-tag $pre \
            --notes-file .github/release-notes.md
